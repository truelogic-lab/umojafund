services:
  - type: web
    name: umoja-api
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "umoja-api.onrender.com"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: MPESA_MODE
        value: "mock"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://umoja-frontend.onrender.com"
      - fromDatabase:
          name: umoja-db
          property: connectionString
    autoDeploy: true

databases:
  - name: umoja-db
    plan: starter
    databaseName: umoja
    user: umoja_user
